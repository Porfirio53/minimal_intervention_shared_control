[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-intervention-shared-control"
version = "0.1.0"
description = "Causally aligned minimal-intervention shared control for delayed teleoperation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "osqp>=1.0",
  "PyYAML>=6.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
data = ["pandas>=2.2", "pyarrow>=17", "rosbags>=0.10", "scikit-learn>=1.5"]
plot = ["matplotlib>=3.9"]
test = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.12"]

[project.scripts]
misc-run = "minimal_intervention_shared_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
